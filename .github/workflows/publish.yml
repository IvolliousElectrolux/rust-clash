name: publish

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-xkb-dev \
            libxcb-xfixes0-dev \
            libwayland-dev
      - name: Install UPX
        if: runner.os != 'macOS'
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          install-only: true
      - name: Test libraries
        run: cargo test -p clash-core -p clash-proxynet -p clash-tun
      - name: Release
        run: cargo build --release -p rust-clash
      - name: UPX (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          where upx
          upx -V
          upx --best --lzma -f -q target\release\rust-clash.exe
      - name: UPX (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v upx
          upx -V
          upx --best --lzma -f -q target/release/rust-clash || echo "upx failed, keeping uncompressed"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rust-clash-${{ matrix.rid }}
          path: |
            target/release/rust-clash
            target/release/rust-clash.exe
          if-no-files-found: ignore
